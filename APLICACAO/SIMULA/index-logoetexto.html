<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Vida Boa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #D2691E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Alinha no topo */
            align-items: flex-start;     /* Alinha à esquerda */
            gap: 20px;                   /* Espaçamento entre as imagens */
            padding: 20px;
        }

        .logo-sem-texto {
            width: 61px; /* 20% da largura original (615px) */
            height: auto;
            display: block;
        }

        .logo-com-texto {
            width: 54px; /* 20% da largura original (543px) */
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <img src="logoavb.svg" alt="Logo AVB" class="logo-sem-texto">
    <img src="logoavbcomtexto.svg" alt="Logo AVB - A Vida Boa" class="logo-com-texto">

</body>
</html>
