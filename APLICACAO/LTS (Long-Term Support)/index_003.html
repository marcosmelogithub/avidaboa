<!--
    22/11/2026 - 22:58
    1) Define a estrutura e o estilo de uma página web chamada "A Vida Boa". 
    2) Inclui um cabeçalho com duas imagens: uma logo à esquerda e um texto centralizado. 
    3) O layout é responsivo, ajustando-se para diferentes tamanhos de tela, incluindo tablets e celulares.
    4) O header possui um fundo leve e harmônico com o tom #184C54 das imagens, além de uma borda inferior 
       e sombra para dar profundidade.
    5) A largura do Header está ajustada à largura do texto do artigo, mantendo a harmonia visual
       e evitando que o header fique muito largo em telas grandes.
    6) Carrega dinamicamente múltiplos arquivos .md (Platão e Budismo) em sequência, aplicando
       independentemente os estilos de introdução, tabelas responsivas e conclusão a cada um.
    7) Os arquivos .md são acessados por links absolutos no GitHub.
    8) A página utiliza a biblioteca Marked.js para converter os arquivos .md em HTML.
 -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Vida Boa</title>
  
  <!-- Importação da fonte Jost (Google Fonts) como fallback elegante para Optima em dispositivos Windows/Android -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Biblioteca Marked.js para converter o arquivo .md em HTML dinamicamente -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIÁVEIS DE MANUTENÇÃO (Edite aqui para alterar todo o visual)
       ========================================================================== */
    :root {
      /* Paleta de Cores */
      --bg-page: #FFFFFF;
      --color-dark: #15464E;     /* Tom mais escuro: Cabeçalhos e ênfases fortes */
      --color-primary: #184C54;  /* Tom intermediário: Texto corrido principal */
      --color-soft: #1B515A;     /* Tom mais claro: Subtítulos, citações e detalhes */
      
      /* Fundos sutis derivados da paleta para blocos e tabelas */
      --bg-tint-light: rgba(24, 76, 84, 0.04);
      --bg-tint-medium: rgba(24, 76, 84, 0.08);
      --border-color: rgba(27, 81, 90, 0.2);

      /* Tipografia (Optima como principal + fallbacks confortáveis) */
      --font-main: 'Optima', 'Candara', 'Jost', 'Segoe UI', sans-serif;

      /* Escala Tipográfica Fluida (Adapta-se automaticamente de Mobile a Desktop) */
      --fs-h1: clamp(1.85rem, 4vw, 2.5rem);
      --fs-h2: clamp(1.35rem, 2.8vw, 1.65rem);
      --fs-h3: clamp(1.25rem, 2.5vw, 1.5rem);
      --fs-body: clamp(1.05rem, 1.5vw, 1.15rem);
      --fs-small: clamp(0.95rem, 1.2vw, 1.02rem);

      /* Espaçamentos e Ritmo Visual */
      --container-max-width: 760px;
      --spacing-section: 2.75rem;
      --spacing-element: 1.25rem;
      --line-height-body: 1.75;
      --line-height-heading: 1.3;
    }

    /* ==========================================================================
       2. RESET E CONFIGURAÇÕES GERAIS
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--color-primary);
      font-family: var(--font-main);
      font-size: var(--fs-body);
      line-height: var(--line-height-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 2rem 1.25rem;
    }

    /* ==========================================================================
       2.1. CABEÇALHO (Alinhado à largura do conteúdo e responsivo)
       ========================================================================== */
    header {
      width: 100%;
      max-width: var(--container-max-width);
      margin: 0 auto 1.75rem auto;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      padding: 1.25rem 1.75rem;
      gap: 1.25rem;
      border-radius: 8px;

      /* Fundo leve e harmônico com o tom #184C54 das imagens */
      background: linear-gradient(180deg, #F3F8F8 0%, #E7F0F1 100%);
      border: 1px solid rgba(24, 76, 84, 0.14);
      box-shadow: 0 2px 10px rgba(24, 76, 84, 0.05);
    }

    .logo-esquerda {
      justify-self: start;
      width: 150px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .texto-centro {
      justify-self: center;
      width: 340px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ==========================================================================
       3. CONTAINER PRINCIPAL (Medida ideal de leitura: 60-75 caracteres/linha)
       ========================================================================== */
    .article-container {
      max-width: var(--container-max-width);
      margin: 0 auto;
      padding: 1rem 0 3rem 0;
    }

    /* Separador visual entre artigos distintos */
    .article-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4.5rem 0;
      gap: 1.25rem;
    }

    .article-divider::before,
    .article-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-color), transparent);
    }

    .article-divider span {
      color: var(--color-soft);
      font-size: 1.15rem;
      letter-spacing: 0.35em;
      padding-left: 0.35em; /* Compensa o letter-spacing final para centralização exata */
      opacity: 0.75;
    }

    /* ==========================================================================
       4. TIPOGRAFIA E HIERARQUIA
       ========================================================================== */
    h1, h2, h3 {
      color: var(--color-dark);
      line-height: var(--line-height-heading);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    h1 {
      font-size: var(--fs-h1);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    h2 {
      font-size: var(--fs-h2);
      margin-bottom: 1rem;
    }

    h3 {
      font-size: var(--fs-h3);
      margin-bottom: 1rem;
    }

    p {
      margin-bottom: var(--spacing-element);
    }

    strong {
      color: var(--color-dark);
      font-weight: 600;
    }

    em {
      color: var(--color-soft);
      font-style: italic;
    }

    /* ==========================================================================
       5. SEÇÕES E DIVISORES (Adaptado para elementos vindos do Markdown)
       ========================================================================== */
    .intro-p {
      font-size: clamp(1.1rem, 1.6vw, 1.22rem);
    }

    /* Quando o arquivo .md usar "---" (hr), ele cria o mesmo espaçamento e borda de seção */
    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: var(--spacing-section) 0;
    }

    /* ==========================================================================
       6. TABELA RESPONSIVA
       ========================================================================== */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 1.75rem 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: var(--fs-small);
    }

    th {
      background-color: var(--bg-tint-medium);
      color: var(--color-dark);
      font-weight: 700;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: var(--bg-tint-light);
    }

    /* ==========================================================================
       7. CITAÇÃO / DESTAQUE (BLOCKQUOTE)
       ========================================================================== */
    blockquote {
      background-color: var(--bg-tint-light);
      border-left: 4px solid var(--color-soft);
      color: var(--color-soft);
      padding: 1.25rem 1.5rem;
      margin: 1.75rem 0;
      border-radius: 0 8px 8px 0;
      font-size: var(--fs-small);
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    blockquote strong {
      color: var(--color-dark);
    }

    /* ==========================================================================
       8. LISTAS (COM MARCADORES E NUMERADAS)
       ========================================================================== */
    ul, ol {
      margin: 1.25rem 0 1.5rem 1.5rem;
    }

    li {
      margin-bottom: 0.75rem;
      padding-left: 0.35rem;
    }

    li::marker {
      color: var(--color-soft);
      font-weight: 700;
    }

    /* ==========================================================================
       9. CAIXA DE CONCLUSÃO / RESUMO FINAL
       ========================================================================== */
    .conclusion-box {
      margin-top: 1.5rem;
      padding: 1.75rem;
      background-color: var(--bg-tint-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .conclusion-box p:last-child {
      margin-bottom: 0;
    }

    /* Mensagem de carregamento / erro */
    .status-msg {
      color: var(--color-soft);
      font-style: italic;
      text-align: center;
      padding: 3rem 0;
    }

    /* ==========================================================================
       10. AJUSTES FINOS PARA CELULARES (MOBILE)
       ========================================================================== */
    @media (max-width: 600px) {
      body {
        padding: 1.25rem 1rem;
      }

      header {
        grid-template-columns: 32% 1fr;
        padding: 0.9rem 1rem;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .logo-esquerda {
        width: 100%;
        max-width: 105px;
      }

      .texto-centro {
        width: 100%;
        max-width: 210px;
      }

      :root {
        --spacing-section: 2.25rem;
        --line-height-body: 1.68;
      }

      .article-divider {
        margin: 3.25rem 0;
      }

      th, td {
        padding: 0.85rem 0.9rem;
      }

      blockquote, .conclusion-box {
        padding: 1.15rem;
      }

      ul, ol {
        margin-left: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <!-- Cabeçalho da página com logo e texto -->
  <header>
    <img id="img-logo" alt="Logo AVB" class="logo-esquerda">
    <img id="img-texto" alt="A Vida Boa" class="texto-centro">
  </header>

  <!-- O conteúdo dos arquivos .md será injetado sequencialmente aqui -->
  <main class="article-container" id="content">
    <p class="status-msg">Carregando conteúdo...</p>
  </main>

  <script>
    // Identificação das imagens do cabeçalho
    const logoavbsomentetexto = "https://raw.githubusercontent.com/marcosmelogithub/avidaboa/refs/heads/main/IMAGENS/logoavbsomentetexto.svg";
    const logoavbsomentelogo = "https://raw.githubusercontent.com/marcosmelogithub/avidaboa/refs/heads/main/IMAGENS/logoavb.svg";

    document.getElementById("img-logo").src = logoavbsomentelogo;
    document.getElementById("img-texto").src = logoavbsomentetexto;

    // Lista ordenada dos arquivos Markdown a serem exibidos
    const artigos = [
      {
        url: "https://raw.githubusercontent.com/marcosmelogithub/avidaboa/refs/heads/main/ARQSMD/AVidaBoa_001_SegundoPlatao.md",
        tituloFallback: "O Pensamento de Platão sobre a Vida Boa"
      },
      {
        url: "https://raw.githubusercontent.com/marcosmelogithub/avidaboa/refs/heads/main/ARQSMD/AVidaBoa_002_SegundoBudismo.md",
        tituloFallback: "O Pensamento do Budismo sobre a Vida Boa"
      }
    ];

    // Processa e aplica toda a estilização original em um bloco <article> isolado
    function renderizarArtigo(markdownText, tituloFallback) {
      const article = document.createElement('article');
      article.innerHTML = marked.parse(markdownText);

      // 1. Garante que exista um título H1 no topo caso o arquivo .md comece direto no texto
      if (!article.querySelector('h1')) {
        const h1 = document.createElement('h1');
        h1.textContent = tituloFallback;
        article.prepend(h1);
      }

      // 2. Estiliza os parágrafos introdutórios (antes da primeira linha divisória <hr> ou subtítulo)
      const children = Array.from(article.children);
      for (const el of children) {
        if (el.tagName === 'HR' || el.tagName === 'H2' || el.tagName === 'H3') break;
        if (el.tagName === 'P') {
          el.classList.add('intro-p');
        }
      }

      // 3. Envolve todas as tabelas na div .table-wrapper para manter a rolagem responsiva no celular
      article.querySelectorAll('table').forEach(table => {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });

      // 4. Transforma o parágrafo final (após o último <hr>) na caixa de conclusão .conclusion-box
      const hrs = article.querySelectorAll('hr');
      if (hrs.length > 0) {
        const lastHr = hrs[hrs.length - 1];
        const lastElement = article.lastElementChild;
        if (lastElement && lastElement.tagName === 'P' && (lastHr.compareDocumentPosition(lastElement) & Node.DOCUMENT_POSITION_FOLLOWING)) {
          const footerBox = document.createElement('footer');
          footerBox.className = 'conclusion-box';
          lastElement.parentNode.insertBefore(footerBox, lastElement);
          footerBox.appendChild(lastElement);
        }
      }

      return article;
    }

    async function carregarTodosMarkdowns() {
      const container = document.getElementById('content');
      const timestamp = new Date().getTime();

      try {
        // Busca todos os arquivos em paralelo preservando a ordem exata da lista
        const resultados = await Promise.all(
          artigos.map(async (artigo) => {
            const response = await fetch(`${artigo.url}?t=${timestamp}`);
            if (!response.ok) {
              throw new Error(`Não foi possível carregar o arquivo ${artigo.url} (${response.status})`);
            }
            const texto = await response.text();
            return renderizarArtigo(texto, artigo.tituloFallback);
          })
        );

        // Limpa a mensagem "Carregando conteúdo..."
        container.innerHTML = '';

        // Insere cada artigo na sequência, adicionando o divisor entre eles
        resultados.forEach((elementoArtigo, index) => {
          if (index > 0) {
            const divisor = document.createElement('div');
            divisor.className = 'article-divider';
            divisor.setAttribute('aria-hidden', 'true');
            divisor.innerHTML = '<span>&#9670; &#9670; &#9670;</span>';
            container.appendChild(divisor);
          }
          container.appendChild(elementoArtigo);
        });

      } catch (erro) {
        console.error(erro);
        container.innerHTML = `
          <div class="conclusion-box">
            <p><strong>Aviso:</strong> ${erro.message}.</p>
            <p>Verifique sua conexão com a internet ou se os links dos arquivos no GitHub estão acessíveis.</p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', carregarTodosMarkdowns);
  </script>

</body>
</html>
