<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Vida Boa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 32px;
            gap: 20px;

            /* Fundo leve e harmônico com o tom #184C54 das imagens */
            background: linear-gradient(180deg, #F3F8F8 0%, #E7F0F1 100%);
            border-bottom: 1px solid rgba(24, 76, 84, 0.14);
            box-shadow: 0 2px 10px rgba(24, 76, 84, 0.05);
        }

        .logo-esquerda {
            justify-self: start;
            width: 210px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        .texto-centro {
            justify-self: center;
            width: 450px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Ajustes para telas menores (Tablets e Celulares) */
        @media (max-width: 768px) {
            header {
                grid-template-columns: auto 1fr;
                padding: 15px 20px;
                gap: 15px;
            }

            .logo-esquerda {
                width: 120px;
            }

            .texto-centro {
                width: 220px;
                justify-self: center;
            }
        }

        @media (max-width: 480px) {
            header {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 16px;
                gap: 12px;
            }

            .logo-esquerda {
                width: 140px;
            }

            .texto-centro {
                width: 240px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img id="img-logo" alt="Logo AVB" class="logo-esquerda">
        <img id="img-texto" alt="A Vida Boa" class="texto-centro">
        <div></div> <!-- Coluna auxiliar para manter o texto centralizado na tela -->
    </header>

    <script>
        // 1 e 2. Criação das variáveis com os links das imagens
        const logoavbsomentetexto = "https://raw.githubusercontent.com/marcosmelogithub/avidaboa/refs/heads/main/IMAGENS/logoavbsomentetexto.svg";
        const logoavbsomentelogo = "https://raw.githubusercontent.com/marcosmelogithub/avidaboa/refs/heads/main/IMAGENS/logoavb.svg";

        // Atribuição das URLs às tags img
        document.getElementById("img-logo").src = logoavbsomentelogo;
        document.getElementById("img-texto").src = logoavbsomentetexto;
    </script>

</body>
</html>
